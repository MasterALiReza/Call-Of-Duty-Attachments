name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy

      - name: Compile Check
        run: |
          python -m compileall -q app core handlers scripts main.py

      - name: Run Tests
        run: |
          pytest -q

      - name: Lint Check (Live Scope)
        run: |
          python -m ruff check \
            handlers/channel \
            handlers/admin/modules/system \
            handlers/admin/modules/reports \
            handlers/admin/user_attachments_admin \
            core/database/repositories \
            core/database/database_pg.py \
            core/audit.py \
            handlers/user/user_attachments \
            handlers/inline \
            handlers/contact

      - name: Type Check (Live Scope)
        run: |
          python -m mypy --follow-imports=skip \
            handlers/channel \
            handlers/admin/modules/system \
            handlers/admin/modules/reports \
            handlers/admin/user_attachments_admin \
            core/database/repositories \
            core/database/database_pg.py \
            core/audit.py \
            handlers/user/user_attachments \
            handlers/inline \
            handlers/contact

  migration-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: codm_bot_ci
      DB_USER: codm_admin_ci
      DB_PASSWORD: codm_admin_ci_pw
      POSTGRES_PASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for PostgreSQL
        run: |
          python - <<'PY'
          import os
          import time
          import psycopg

          dsn = (
              f"host={os.environ['DB_HOST']} port={os.environ['DB_PORT']} "
              f"user=postgres password={os.environ['POSTGRES_PASSWORD']} dbname=postgres"
          )

          for attempt in range(30):
              try:
                  with psycopg.connect(dsn):
                      print("PostgreSQL is ready")
                      break
              except Exception as exc:
                  print(f"Waiting for PostgreSQL ({attempt + 1}/30): {exc}")
                  time.sleep(2)
          else:
              raise SystemExit("PostgreSQL did not become ready in time")
          PY

      - name: Canonical Bootstrap Smoke
        run: |
          python scripts/setup_database.py --drop-existing

      - name: Verify Canonical Bootstrap
        run: |
          python scripts/verify_canonical_bootstrap.py --require-migration 0004_schema_canonical_backfill.sql
