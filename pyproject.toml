[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true

# PEP 484 implicit optional fallback - allowing gradual typing 
# instead of erroring on all 3300 implicit optionals at once
no_implicit_optional = false

# Ignore specific legacy modules until fully typed
[[tool.mypy.overrides]]
module = "scripts.legacy.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:'asyncio.iscoroutinefunction' is deprecated.*:DeprecationWarning:pytest_asyncio.plugin",
    "ignore:'asyncio.get_event_loop_policy' is deprecated.*:DeprecationWarning:pytest_asyncio.plugin",
    "ignore:'asyncio.set_event_loop_policy' is deprecated.*:DeprecationWarning:pytest_asyncio.plugin",
    "ignore:If 'per_message=False', 'CallbackQueryHandler' will not be tracked for every message.*",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
